services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: abhay-portfolio:latest
    container_name: abhay-portfolio
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
