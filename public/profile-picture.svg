<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#profileGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Inner circle -->
  <circle cx="200" cy="200" r="170" fill="#0f172a" opacity="0.7"/>
  
  <!-- Person silhouette -->
  <g transform="translate(200,200)" fill="url(#profileGradient)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="40" />
    
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="60" ry="80" />
    
    <!-- Arms -->
    <ellipse cx="-45" cy="0" rx="20" ry="60" transform="rotate(-20)" />
    <ellipse cx="45" cy="0" rx="20" ry="60" transform="rotate(20)" />
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="3" fill="#06b6d4" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="120" r="2" fill="#10b981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="280" r="4" fill="#f59e0b" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="320" r="2.5" fill="#8b5cf6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
